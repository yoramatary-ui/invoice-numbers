<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הטבעת מספרי תעודה על קבצי PDF</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>הטבעת מספרי תעודה על קבצי PDF</h1>
    <p>
      העלו קובץ אקסל אחד עם שמות ומספרי תעודה, וכמה קבצי PDF שהשם שלהם
      (ללא הסיומת) מופיע באקסל. האפליקציה תמצא עבור כל PDF את מספר התעודה
      המתאים, תדביק אותו בחלק העליון והאמצעי של כל עמוד, ותאפשר להוריד את
      כל הקבצים המעודכנים כקובץ ZIP.
    </p>

    <form id="upload-form">
      <label class="field">
        <span>קובץ אקסל</span>
        <input type="file" id="excel-input" name="excel" accept=".xlsx,.xls,.csv" required />
      </label>

      <label class="field">
        <span>קבצי PDF</span>
        <input type="file" id="pdfs-input" name="pdfs" accept="application/pdf" multiple required />
      </label>

      <button type="submit" id="submit-btn">עבד והורד ZIP</button>
    </form>

    <div id="status" class="status" role="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
